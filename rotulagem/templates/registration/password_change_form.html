{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card shadow-sm">
      <div class="card-header bg-success text-white py-3">
        <h5 class="mb-0"><i class="bi bi-key"></i> Alterar senha</h5>
      </div>
      <div class="card-body p-4">
        <form method="post">
          {% csrf_token %}
          {% for field in form %}
            <div class="mb-3">
              <label class="form-label">{{ field.label }}</label>
              {{ field }}
              {% if field.errors %}
                <div class="text-danger small">{{ field.errors }}</div>
              {% endif %}
              {% if field.help_text %}
                <div class="form-text">{{ field.help_text }}</div>
              {% endif %}
            </div>
          {% endfor %}
          <button type="submit" class="btn btn-success w-100">Salvar nova senha</button>
        </form>
      </div>
    </div>
  </div>
</div>
<script>
  document.querySelectorAll('form input[type="password"]').forEach(el => el.classList.add('form-control'));
</script>
{% endblock %}
