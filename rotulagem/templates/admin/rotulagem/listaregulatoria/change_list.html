{% extends "admin/change_list.html" %}

{% block object-tools-items %}
  <li>
    <a href="{% url 'admin:rotulagem_listaregulatoria_importar_in28' %}"
       style="background:#0D3B2E">
      ⬇ Importar IN 28/2018 (dash de OPs)
    </a>
  </li>
  <li>
    <form method="post" action="{% url 'admin:rotulagem_listaregulatoria_importar_idr' %}"
          style="display:inline">
      {% csrf_token %}
      <button type="submit" class="button"
              style="background:#00996E;color:#fff;border:0;padding:5px 10px;
                     border-radius:4px;cursor:pointer;font-size:.8125rem"
              title="Popula os valores de IDR da RDC 269/2005, base do cálculo de %VD">
        ⬇ Popular IDR (RDC 269/2005)
      </button>
    </form>
  </li>
  {{ block.super }}
{% endblock %}
