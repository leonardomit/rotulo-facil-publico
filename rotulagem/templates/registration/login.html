{% load static %}<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Rótulo Fácil</title>

  <link rel="icon" href="{% static 'favicon.png' %}" type="image/png" sizes="128x128">
  <link rel="shortcut icon" href="{% static 'favicon.ico' %}" sizes="any">
  <link rel="apple-touch-icon" href="{% static 'apple-touch-icon.png' %}">

  <script>
    /* Mesma preferência de tema dos outros painéis (cookie compartilhado). */
    (function(){try{
    var m=document.cookie.match(/(?:^|;\s*)fito-theme=(dark|light)/);
    var t=m?m[1]:(window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
    document.documentElement.setAttribute('data-theme',t);
    document.documentElement.setAttribute('data-bs-theme',t);}catch(e){}})();
  </script>
  <script src="{% static 'fito-ui.js' %}" defer></script>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    :root {
      /* Paleta Fito — mesma identidade do Dash Comercial e Rastreabilidade de Lotes */
      --verde: #00996E;
      --verde-dark: #007A57;
      --verde-profundo: #0D3B2E;
      --bg: #F6EFE4;
      --surface: #FDFAF4;
      --borda: #E7DECC;
      --borda-forte: #CFC5B0;
      --surface-2: #F3ECDF;
      --texto: #2B2926;
      --texto-sec: #5C564C;
      --texto-muted: #8B8377;
      --vermelho: #C0402E;

      --surface-1: var(--surface);
      --text-primary: var(--texto);
      --text-secondary: var(--texto-sec);
      --border: var(--borda);
      --border-strong: var(--borda-forte);
      color-scheme: light;
    }
    :root[data-theme="dark"] {
      --verde: #1FB98A;
      --verde-dark: #3ACFA1;
      --bg: #081F18;
      --surface: #0D362A;
      --surface-2: #124232;
      --borda: #1E4C3C;
      --borda-forte: #2A5A48;
      --texto: #F6EFE4;
      --texto-sec: #BCD2C6;
      --texto-muted: #86A395;
      --vermelho: #E0705F;
      color-scheme: dark;
    }
    body {
      background: var(--bg);
      color: var(--texto);
      font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
    }
    .card { border: 1px solid var(--borda); border-radius: 14px; overflow: hidden; }
    .card-header {
      /* Verde-profundo é fundo estrutural: continua escuro nos dois temas. */
      background: linear-gradient(135deg, #0D3B2E 0%, #145041 100%) !important;
      border: none;
    }
    .fito-login-topo { display: flex; justify-content: flex-end; margin-bottom: 10px; }
    .fito-theme-btn {
      display: inline-flex; align-items: center; justify-content: center;
      width: 34px; height: 34px; padding: 0; border-radius: 999px;
      font-size: .95rem; line-height: 1; cursor: pointer;
      border: 1px solid var(--border); background: var(--surface-1); color: var(--text-secondary);
      transition: background-color 150ms ease, border-color 150ms ease, color 150ms ease;
    }
    .fito-theme-btn:hover { background: var(--surface-2); border-color: var(--border-strong); color: var(--text-primary); }
    .card-body { background: var(--surface); }
    .form-control:focus { border-color: var(--verde); box-shadow: 0 0 0 3px rgba(0,153,110,.12); }
    .btn-success { background-color: var(--verde) !important; border-color: var(--verde) !important; }
    .btn-success:hover { background-color: var(--verde-dark) !important; border-color: var(--verde-dark) !important; }
    .text-danger { color: var(--vermelho) !important; }
  </style>
</head>
<body>
<div class="container" style="max-width:400px; margin-top:80px;">
  <div class="fito-login-topo">
    <!-- Ícone e rótulo são ajustados pelo fito-ui.js conforme o tema -->
    <button type="button" class="fito-theme-btn" data-fito-theme-toggle></button>
  </div>
  <div class="card shadow-sm">
    <div class="card-header bg-success text-white text-center py-3">
      <h4 class="mb-0"><i class="bi bi-capsule"></i> Rótulo Fácil</h4>
    </div>
    <div class="card-body p-4">
      <form method="post">
        {% csrf_token %}
        {% for field in form %}
          <div class="mb-3">
            <label class="form-label">{{ field.label }}</label>
            {{ field }}
            {% if field.errors %}
              <div class="text-danger small">{{ field.errors }}</div>
            {% endif %}
          </div>
        {% endfor %}
        <button type="submit" class="btn btn-success w-100">Entrar</button>
      </form>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  // Add Bootstrap classes to form inputs
  document.querySelectorAll('input').forEach(el => el.classList.add('form-control'));
</script>
</body>
</html>
